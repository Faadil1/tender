  - Do not give the public judge runtime a value-moving KeeperHub adapter.
next_action: Pull merged main, discard only the locally regenerated replay-harness timestamp artifact if needed, verify main, redeploy the existing Cloudflare Worker, then QA the live clearing-desk runtime before video lock.

