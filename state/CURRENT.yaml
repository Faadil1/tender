  reviewer_roster:
    - Claude: maintainer / mergeability / hidden coupling
    - Gemini: systems / API / schema / concurrency
    - Grok: adversarial duplicates / competition / recurrence
    - Perplexity: evidence / adjacent systems / independent recurrence
    - Kimi: product boundary / semantics / DX
    - DeepSeek: source-level reliability / cross-surface parity / race windows
    - ChatGPT: fact-check / synthesis / final overlap gate
  next_gate:
    - Run Grok against the updated whitespace packet for adversarial duplicate/competition/recurrence discovery.
    - If Grok finds no surviving candidate, run fresh Gemini + Kimi passes against the updated no-go set.
    - Fact-check every current-repo claim before promotion.
    - Cross-examine candidate overlap across all reviewer outputs.
    - If nothing high-signal survives, skip the bounty rather than duplicate active work.
    - Re-run issue/PR overlap immediately before filing anything.

remaining_work:
  - Continue Benita UI/UX redesign.
  - Bind Tender to one real existing product/workstream through an acceptance adapter for stronger main-track evidence.
  - QA redesigned product on desktop/mobile/reduced-motion and failure states.
  - Lock <=3 minute demo/video and final submission packaging.
  - Complete full multi-LLM whitespace gate (Claude, Gemini, Grok, Perplexity, Kimi, DeepSeek) without changing locked Tender runtime semantics.

do_not:
  - Do not rerun the canonical value-moving proof without a distinct explicit reason.
  - Do not expose TENDER_OPERATOR_TOKEN or KeeperHub API keys.
  - Do not switch OPERATOR_SETTLEMENT_MODE to workflow during current QA/demo work.
  - Do not weaken Tender into generic merge-to-pay or a bounty marketplace.
  - Do not add value-moving execution to the public judge runtime.
  - Do not implement upstream KeeperHub code before an issue is accepted.
  - Do not chase "#2373", "#2495/#2552", or "#2408".

next_action: Keep Tender runtime/proof locked. Run Grok next against the updated KeeperHub whitespace packet; if nothing survives, run fresh Gemini + Kimi passes. Fact-check every surviving claim and file nothing unless one independently evidenced unclaimed candidate survives.
