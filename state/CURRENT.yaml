category: economic clearing for accepted work
north_star: "Accepted once. Owed once. Settled once."
completed_work:
  - Git history preserved and pushed to canonical GitHub main.
  - Tender Claim is the deterministic economic primitive and Tender Receipt is the settlement artifact.
  - Exactly-once hardening covers concurrency, replay, reconciliation, sticky REQUIRES_ACCEPTANCE, and fail-closed in-flight handling.
  - Canonical Tender-caused live settlement completed through GitHub Actions and canonical replay returned ALREADY_SETTLED with zero additional KeeperHub executions and $0 additional movement.
  - Canonical live-proof artifact is preserved in evidence/live-proof.json.
  - Cloudflare Worker judge runtime executes safe dynamic verification without a value-moving public adapter.
  - Winning delta PR #1 merged to main.
  - Operator hardening PR #2 passed final gate and was squash-merged to main as 3100b56755eb61a638836e34835889ca4c4b0d83.
  - Authenticated operator write-path is implemented for policy creation/locking, acceptance ingestion, obligation creation, authorization, settlement, reconciliation, supersession, and corrective claims.
  - EconomicAuthorization is bound to exact authorizedClaimId and linkedClaimId and supports one-time atomic consumption on a strong operator store.
  - Operator reconciliation routes through SettlementEngine receipt finalization.
  - Locked/pre-committed policy semantics are enforced before obligation creation and value movement.
  - Workflow settlement fails closed on eventual KV-only storage; KV remains acceptable only for non-value-moving/dev/proof paths.
  - PR CI runs on pull_request to main.
