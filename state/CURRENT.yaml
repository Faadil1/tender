keeperhub_bounty_intelligence:
  status: multi_llm_whitespace_discovery_perplexity_deepseek_and_claude_phase2_fact_checked
  separate_buidl_required: true
  research_doc: docs/KEEPERHUB-BOUNTY-INTELLIGENCE.md
  review_packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
  synthesis_doc: docs/EXTERNAL-LLM-CRITIQUE-SYNTHESIS.md
  whitespace_packet: docs/KEEPERHUB-WHITESPACE-MULTI-LLM-PACKET.md
  contribution_rule: "Issue -> Reason/Scope/Plan -> wait for accepted -> implement -> test -> PR to staging"

  external_reviews:
    claude:
      status: phase2_received_and_fact_checked
      effect: no candidate promoted; direct execution typed failure status locked RESEARCH ONLY
      retained:
        - Cited reliability incidents do not implicate nested status error fields.
        - No repeated consumer workaround or caller harm from result.errorClass/result.rejection placement was found.
        - ExecuteResponse immediate fields versus durable status.result is a plausible intentional boundary.
        - Top-level normalization is not bounty-worthy on API symmetry alone.
        - Generic retryable semantics remain unsupported without a stable source of truth.
      corrections:
        - "#2206 is closed, not active; PR #2213 merged the standardized protocol-write ExecuteResponse envelope."
        - "PR #2528 is a separate MCP simulate-response DX/documentation thread and does not prove a direct-status contract defect."
    gemini:
      status: received_and_fact_checked
      retained:
        - Do not make KeeperHub the permanent authority for Tender-style business identity.
        - Do not attempt universal semantic EVM effect fingerprinting.
        - Permanent reference uniqueness plus request binding creates hard retry/lifecycle semantics.
        - Metadata-only caller correlation is simpler than a second permanent dedup state machine.
    perplexity:
      status: phase1_and_phase2_received_fact_checked
      retained:
        - Existing executionId + Idempotency-Key + transaction/proof identifiers make a second generic identity expensive to justify.
        - Generic semantic-effect equality is not a valid platform primitive.
        - Permanent reference uniqueness requires explicit release/reuse/retention/supersession semantics.
        - Independent recurrence for a generic caller reference remains weak.
        - Metadata-only reference may be too small/ordinary for the bounty without stronger demand.
        - Phase-2 liveness candidate was rejected because KeeperHub already has public /api/health plus distributed component liveness/metrics.
        - Phase-2 idempotency request-hash candidate was rejected because requestHash conflict handling already exists.
        - Completion callbacks remain research-only: absence found, but no narrow KeeperHub-specific demand yet.
    deepseek:
      status: phase2_received_fact_checked
      retained:
        - Returned RESEARCH PRIMARY FURTHER rather than inventing a source-level candidate without adequate access.
        - REST/MCP parity must be proven with a concrete dropped field; current idempotency_key and gas_limit_multiplier propagation are covered.
        - Top-level direct-status typed errors remain a low-confidence DX observation only.
      corrections:
        - "#2004 is open/accepted and already covers simulate parity across /api/execute/*."
        - "lib/reaper/reap-stale-executions.ts already handles stale pending/running workflow executions."
        - "#2425 is open/accepted/confirmed and already owns a chain/function-set invariant gap."
    kimi:
      status: received_and_fact_checked
      retained:
        - Permanent fail-closed execution references leak Tender-style business semantics into KeeperHub.
        - Permanent binding conflicts with KeeperHub's definite-failure release path under #1840/PR #2372.
        - "#2495/#2552 already provides a scoped durable runKey where platform-owned identity is concretely justified."
        - KeeperHub stable-key documentation already covers much of deterministic retry identity.
        - Cross-route reference scoping is unresolved and weakens the generic proposal.
      corrections:
        - "#2408 is closed/completed, accepted/confirmed, and cannot be taken as our new bounty issue."
        - "PR #2446 merged the accepted docs half and closed #2408."
        - "The execution-level softened-error carrier/analytics remainder was explicitly retained by KeeperHub core-team discussion."

  candidate_status:
    effect_bound_execution_reference:
      status: stop_do_not_file
      reasons:
        - business-semantic leakage
        - second generic idempotency/identity state machine
        - unsafe semantic-effect claim
        - lifecycle/retention/retry ambiguity
        - overlap with "#2495/#2552"
        - weak independent recurrence evidence
    callerReference_metadata_only:
      status: hold_low_priority
      semantics:
        - optional caller-owned metadata
        - non_unique
        - status exposure and org-scoped lookup only
        - no deduplication
        - no effect hashing
        - no 409 semantics
      blocker: insufficient independent recurrence / may be too weak for bounty
    broad_outcome_reconciliation:
      status: no_go_as_new_bounty_candidate
      reason: strongest sub-problems already fixed/closed or actively covered
    softened_error_execution_contract:
      status: no_go_occupied
      issue: 2408
      reason: issue closed/completed; docs merged via PR 2446; remaining execution-level shape retained by core team
    direct_execution_typed_failure_status:
      status: research_only_do_not_file
      reason: no concrete recurring caller harm or workaround caused by nested typed-error placement; adjacent #2206 gap already fixed by merged PR #2213

  verified_overlap:
