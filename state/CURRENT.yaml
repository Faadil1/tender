    - Preserve fail-closed states, replay/mutation proof, and separation of public proof vs authenticated operator surfaces.

keeperhub_bounty_intelligence:
  status: external_review_in_progress_gemini_and_perplexity_fact_checked
  separate_buidl_required: true
  research_doc: docs/KEEPERHUB-BOUNTY-INTELLIGENCE.md
  review_packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
  synthesis_doc: docs/EXTERNAL-LLM-CRITIQUE-SYNTHESIS.md
  contribution_rule: "Issue -> Reason/Scope/Plan -> wait for accepted -> implement -> test -> PR to staging"

  external_reviews:
    gemini:
      status: received_and_fact_checked
      retained:
        - Do not make KeeperHub the permanent authority for Tender-style business identity.
        - Do not attempt universal semantic EVM effect fingerprinting.
        - Permanent reference uniqueness plus request binding creates hard retry/lifecycle semantics.
        - Metadata-only caller correlation is simpler than a second permanent dedup state machine.
      corrections:
        - "#1840 is open/accepted/confirmed; PR #2372 is open, mergeable, not merged."
        - "#2373 is open/confirmed/needs-discussion, not accepted, and already has active implementation/tests."
    perplexity:
      status: received_and_fact_checked
      retained:
        - Existing executionId + Idempotency-Key + transaction/proof identifiers make a second generic identity expensive to justify.
        - Generic semantic-effect equality is not a valid platform primitive.
        - Permanent reference uniqueness requires explicit release/reuse/retention/supersession semantics.
        - Independent recurrence for a generic caller reference remains weak.
        - Metadata-only clientReferenceId may be too small/ordinary for the bounty without stronger demand.
      corrections:
        - Broad broadcast-outcome/reconciliation is not clean whitespace; several cited problems are already closed/fixed or actively owned.

  candidate_status:
    effect_bound_execution_reference:
      status: stop_do_not_file
      reasons:
        - second generic idempotency/identity state machine
        - unsafe semantic-effect claim
        - lifecycle/retention/retry ambiguity
        - weak independent recurrence evidence
    clientReferenceId_metadata_only:
      status: hold_low_priority
      semantics:
        - optional caller-owned metadata
        - non_unique
        - status exposure and org-scoped lookup only
        - no deduplication
        - no effect hashing
        - no 409 semantics
      blocker: insufficient independent recurrence / may be too weak for bounty
    broad_outcome_reconciliation:
      status: no_go_as_new_bounty_candidate
      reason: strongest sub-problems already fixed/closed or actively covered

  verified_overlap:
    issue_1840: open_accepted_confirmed
    pr_2372: open_mergeable_not_merged
    issue_2373: open_confirmed_needs_discussion_not_accepted
    issue_2020: closed_completed
    pr_2162: merged
    issue_2177: closed_completed
    issue_2374: closed_completed
    pr_2386: merged
    issue_1979: closed_completed
    issue_2495: open_accepted_confirmed
    pr_2552: open_mergeable_not_merged

  no_go_areas:
    - "#2373 asynchronous idempotency release after reconciled conclusive failure"
    - "#2495/#2552 partial payout resume / web3/disburse"
    - generic post-broadcast outcome/reconciliation layer
    - generic sequential simulation or preflight firewall
    - receipt export
    - executed-call verification
    - permission cards
    - multi-model consensus
    - generic EVM sign-and-hold
    - generic framework connector
    - generic Merkle audit
    - generic cross-chain status
    - universal semantic-effect fingerprinting

  next_gate:
    - Run Claude maintainer/mergeability critique.
    - Run Grok adversarial uniqueness/duplicate critique.
    - Use remaining reviews to discover a new narrow whitespace candidate rather than rescue the rejected reference idea.
    - If nothing high-signal survives, skip the bounty rather than duplicate active work.
    - Re-run issue/PR overlap immediately before filing anything.

remaining_work:
  - Continue Benita UI/UX redesign.
  - Bind Tender to one real existing product/workstream through an acceptance adapter for stronger main-track evidence.
  - QA redesigned product on desktop/mobile/reduced-motion and failure states.
  - Lock <=3 minute demo/video and final submission packaging.
  - Complete Claude/Grok bounty-review gate without changing locked Tender runtime semantics.

do_not:
  - Do not rerun the canonical value-moving proof without a distinct explicit reason.
  - Do not expose TENDER_OPERATOR_TOKEN or KeeperHub API keys.
  - Do not switch OPERATOR_SETTLEMENT_MODE to workflow during current QA/demo work.
  - Do not weaken Tender into generic merge-to-pay or a bounty marketplace.
  - Do not add value-moving execution to the public judge runtime.
  - Do not implement upstream KeeperHub code before an issue is accepted.
  - Do not chase #2373 or #2495/#2552.

next_action: Keep Tender runtime/proof locked. Continue UI/UX and main-track live-product binding. Obtain Claude and Grok critiques, then run a fresh KeeperHub whitespace sweep for one small, independently evidenced, unclaimed mergeable feature.