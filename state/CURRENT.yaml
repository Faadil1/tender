keeperhub_bounty_intelligence:
  status: competitive_scan_expanded_external_review_ready
  separate_buidl_required: true
  research_doc: docs/KEEPERHUB-BOUNTY-INTELLIGENCE.md
  external_review_packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
  upstream_rule:
    - Behavior-changing work requires a KeeperHub issue first.
    - Issue must contain Reason, Scope, and Plan.
    - Do not code until the issue is labeled accepted.
    - Target KeeperHub staging and implement the accepted plan, not a speculative variant.
  hackathon_signal:
    - Main track favors KeeperHub integrated into a live project/product instead of another standalone demo.
    - Separate feature bounty favors a feature KeeperHub can merge.
    - Tender main-track and bounty work must remain separately packaged.
  winner_signal:
    - production seriousness
    - live/reproducible proof
    - reusable primitives
    - test depth
    - real integration feedback
    - upstream usefulness
  recurring_problem_clusters:
    - durable execution identity, replay, and ambiguous outcomes
    - ambiguous status/proof interpretation
    - simulation fidelity and state propagation
    - machine-readable action contracts and agent discoverability
    - trigger liveness and observability
    - signer and authorization clarity
  current_submission_overlap:
    finaltab: durable settlement intent, consent, chain proof, replay/crash recovery
    agentkeeper_mcp: guarded MCP execution, dry-run, idempotency, x402, Merkle audit, multi-chain controls
    landed: verified landing, stable references, recovery semantics
    nyrvok: sequential preflight and invariant firewall
  adjacent_platform_lessons:
    - Chainlink-style deterministic execution should remain separate from open-ended reasoning.
    - OpenZeppelin-style relayer/recovery issues reinforce explicit unknown/unconfirmed states and retry discipline.
    - Hypernative/Monitor reinforce detection-execution separation.
    - Almanak reinforces strategy/human approval above the execution plane.
    - Do not derive durable business truth from a transient transport state.
  tender_adoptable_mechanisms:
    - explicit authority separation across acceptance, obligation, authorization, execution, proof
    - explicit non-terminal unknown/unconfirmed states
    - independent chain proof
    - stable Claim identity separate from execution IDs and retry keys
    - clear polling/recovery semantics
    - bind at least one real existing product/workstream through an acceptance adapter for main-track proof
  uniqueness_guardrail:
    - Tender remains the economic-obligation layer above execution.
    - Do not compete on generic settlement verification, generic idempotency, simulation firewall, Merkle audit, permission cards, or framework wrappers.
    - Preserve the distinction: accepted work creates an obligation; KeeperHub executes an already-authorized effect.
  provisional_bounty_candidate:
    name: Effect-Bound Execution Reference
    status: source_validated_final_name_sweep_clean_pending_external_critique
    hypothesis: logical effect identity can outlive transport idempotency and is repeatedly reimplemented as reference/runKey/settlement-intent state by integrations
    source_validation:
      direct_execution_row_is_durable_audit_record: true
      status_lookup_is_internal_execution_id_only: true
      idempotency_completed_ttl: 24h
      idempotency_request_hash_exists: true
      atomic_execution_reservation_boundary: checkAndReserveExecution
      caller_defined_durable_reference_exists_today: false
      candidate_can_compose_with_existing_idempotency: true
    final_overlap_sweep:
      date: 2026-09-17
      terms:
        - execution reference
        - effect reference
        - durable reference
        - reference lookup
      issue_direct_duplicate_found: false
      pr_direct_duplicate_found: false
      semantic_overlap_still_requires_review: true
    minimal_shape:
      - optional durable reference on a bounded set of value-moving direct execution routes
      - bind organization+reference to deterministic exact request hash and executionId
      - same reference + same bound request resolves original execution/proof
      - same reference + changed request fails closed with typed conflict
      - expose reference in status and one read-only lookup path
      - keep existing 24h Idempotency-Key behavior unchanged
      - no invoice/work/obligation interpretation inside KeeperHub
    mergeability_bias:
      - Prefer exact-request binding for v1 over a universal semantic effect canonicalizer.
      - Scope reference to organization, not API key.
      - Reserve the reference at the same atomic boundary that creates the direct execution row.
    open_design_questions:
      - final field name
      - whether route/action participates in uniqueness scope
      - direct execution column vs separate binding table
      - lookup route shape
      - retention semantics
      - v1 route set
      - validation/redaction of caller references
    issue_filed: false
    implementation_started: false
  no_go_bounty_duplicates:
    - "#2495 partial payout resume / web3/disburse"
    - generic sequential simulation or preflight firewall
    - "#2395 receipt export"
    - "#2503 direct-call verification"
    - "#2398 permission/generative cards"
    - "#2318 multi-model consensus node"
    - "#2479 chain-agnostic sign-and-hold"
    - generic framework connector
    - generic Merkle audit
    - generic cross-chain status
  external_llm_review:
    status: packet_ready_not_executed
    packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
    plugin_directory_check: no_direct_claude_gemini_grok_provider_integration_surfaced
    planned_reviewers:
      - Claude for maintainer/mergeability critique
      - Gemini for API/schema/migration/concurrency critique
      - Grok for adversarial uniqueness/duplicate search
    synthesis_rule: one evidence-backed fatal objection defeats majority agreement
    rule: do not claim external-model review is complete until actual outputs are obtained
  next_gate:
    - Run the external-LLM critique packet.
    - Record evidence-backed synthesis.
    - Draft KeeperHub Reason/Scope/Plan issue only after critique.
    - Re-run final upstream overlap immediately before filing.
    - File only if still distinct, then wait for accepted before code.

remaining_qa:
  - QA redesigned product on desktop/mobile and reduced motion.
  - QA loading/error/failure states and navigation after UI changes.
  - Lock demo narrative/video and final submission packaging.
  - Bind Tender to a real existing product/workstream through an acceptance adapter for stronger main-track evidence.

local_worktree_note:
  - npm run verify regenerates evidence/settlement-replay-harness.json timestamp locally.
  - Restore only that generated file before future branch/commit work if it is the sole local modification.

do_not:
  - Do not repeat the manual calibration payment.
  - Do not rerun the canonical value-moving live proof without a new explicit proof objective.
  - Do not expose TENDER_OPERATOR_TOKEN or KeeperHub API keys.
  - Do not switch OPERATOR_SETTLEMENT_MODE to workflow during smoke/demo QA.
  - Do not frame Tender as a bounty marketplace or generic merge-to-pay tool.
  - Do not give the public judge runtime a value-moving execution adapter.
  - Do not change locked Tender runtime semantics merely to chase the KeeperHub bounty.
  - Do not implement an upstream KeeperHub feature before its issue is accepted.

next_action: Keep the verified Tender runtime locked. Continue Benita UI/UX work, bind Tender to one real existing workstream for main-track proof, and run the external LLM critique packet before drafting or filing the KeeperHub bounty issue.