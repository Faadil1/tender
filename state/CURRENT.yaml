north_star: "Accepted once. Owed once. Settled once."
completed_work:
  - Git history preserved and pushed to canonical GitHub main.
  - Tender Claim is the deterministic economic primitive and Tender Receipt is the settlement artifact.
  - Exactly-once hardening covers concurrency, replay, reconciliation, and fail-closed in-flight handling.
  - KeeperHub Manual trigger uses required dynamic recipient and amount inputs.
  - Read-only KeeperHub preflight passed with workflow visibility and ERC20 dry-run wouldRevert=false.
  - Canonical Tender-caused live settlement completed through GitHub Actions.
  - Canonical replay returned ALREADY_SETTLED with zero additional KeeperHub executions and $0 additional movement.
  - Canonical live-proof artifact is preserved in evidence/live-proof.json.
  - Cloudflare Worker runtime executes judge-safe Tender verification without a value-moving adapter.
  - Winning delta PR #1 was locally verified with 16/16 tests and 10 replay scenarios with 0 duplicate payouts, then squash-merged to main.
  - Economic identity now normalizes economically equivalent decimal amount formatting.
  - Domain-level obligation verifier distinguishes SAME_CLAIM from NEW_CLAIM / REQUIRES_ACCEPTANCE.
  - Pre-committed settlement policy artifact, Acceptance Packet, independent Base Sepolia chain proof, same-vs-altered Claim inspector, and clearing-desk UI are implemented.
  - Competitive Winning Intelligence incorporates prior KeeperHub winner patterns and current-field overlap without copying competitor product surfaces.
