      status: filed_waiting_for_triage
      upstream_issue: 2560
      upstream_url: https://github.com/KeeperHub/keeperhub/issues/2560
      labels:
        - bug
        - needs-triage
      maintainer_comments: 0
      checked_staging_sha: 7104df9db8d2f171731185c6349855b59136e147
      preferred_fix: status_body_wide
      problem: MCP get_direct_execution_status drops the X-Poll-Interval-Hint terminality/cadence contract that agent docs require callers to follow
      strongest_evidence:
        - status route computes pollIntervalHint from server terminal statuses and emits it only in X-Poll-Interval-Hint
        - lib/mcp/tools.ts callApi returns response.json and get_direct_execution_status JSON.stringify(data), so response headers are discarded
        - docs/getting-started/agent.md tells get_direct_execution_status callers to wait by X-Poll-Interval-Hint and treat 0 as terminal
        - maintainer comment on #2058 says MCP/REST shapes are meant to align and concrete mismatches should be filed separately
      smallest_v1: surface the existing poll hint in the MCP-visible status result, preferably from the same value/header source; no DB or state-machine change
      final_overlap:
        exact_and_semantic_sweeps: clean
        active_exact_owner: none_found
        historical_related_only:
