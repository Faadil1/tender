keeperhub_bounty_intelligence:
  status: poll_contract_filed_expedited_triage_required
  separate_buidl_required: true
  research_doc: docs/KEEPERHUB-BOUNTY-INTELLIGENCE.md
  review_packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
  synthesis_doc: docs/EXTERNAL-LLM-CRITIQUE-SYNTHESIS.md
  whitespace_packet: docs/KEEPERHUB-WHITESPACE-MULTI-LLM-PACKET.md
  contribution_rule: "Issue -> Reason/Scope/Plan -> wait for accepted -> implement -> test -> PR to staging"

  external_reviews:
    claude:
      status: phase2_received_and_fact_checked
      effect: no candidate promoted; direct execution typed failure status locked RESEARCH ONLY
      retained:
        - Cited reliability incidents do not implicate nested status error fields.
        - No repeated consumer workaround or caller harm from result.errorClass/result.rejection placement was found.
        - ExecuteResponse immediate fields versus durable status.result is a plausible intentional boundary.
        - Top-level normalization is not bounty-worthy on API symmetry alone.
        - Generic retryable semantics remain unsupported without a stable source of truth.
      corrections:
        - "#2206 is closed, not active; PR #2213 merged the standardized protocol-write ExecuteResponse envelope."
        - "PR #2528 is a separate MCP simulate-response DX/documentation thread and does not prove a direct-status contract defect."
    gemini:
      status: targeted_poll_contract_cross_exam_valid_fact_checked
      effect: promotes status-body-wide as preferred fix; Grok provisional primary strengthened
      final_classification: PROMOTE_STATUS_BODY_WIDE
      retained:
        - MCP get_direct_execution_status cannot observe X-Poll-Interval-Hint because callApi returns only parsed JSON.
        - Agent docs explicitly instruct that MCP tool to honor X-Poll-Interval-Hint and treat 0 as terminal.
        - #2058 maintainer guidance says execute-tool MCP and REST response shapes are meant to align and concrete field mismatches should be filed separately.
        - Adding pollIntervalHint to ExecutionStatusResponse is additive and lets MCP inherit the same body field without tool-specific synthesis.
        - The status route already computes pollIntervalHint once before header emission, so body and header can be populated from the same local value.
      corrections:
        - "The explicit lower-bound status-list wording is in docs/api/executions.md, not docs/api/direct-execution.md."
        - "Do not claim PR #1526's header-only shape was an oversight; intent is not proven. The present MCP/doc contradiction is sufficient."
        - "Forward-compatibility is supported by the documented server-owned header terminality contract, but current direct-execution docs also still tell callers to poll until completed/failed."
      preferred_fix: add pollIntervalHint:number to ExecutionStatusResponse and populate body + X-Poll-Interval-Hint from the same computed value
      required_test: body.pollIntervalHint must equal numeric X-Poll-Interval-Hint for every status; 0 iff server terminal set says terminal
      retained_from_earlier_pass:
        - Do not make KeeperHub the permanent authority for Tender-style business identity.
        - Do not attempt universal semantic EVM effect fingerprinting.
        - Permanent reference uniqueness plus request binding creates hard retry/lifecycle semantics.
        - Metadata-only caller correlation is simpler than a second permanent dedup state machine.
      latest_pass_corrections:
        - "The proposed QUEUED -> CLAIMED/RUNNING -> BROADCASTING -> CONFIRMED/FAILED direct-execution lifecycle does not match current staging."
        - "directExecutions uses pending/running/completed/failed plus unconfirmed in service/types; direct routes reserve then immediately markRunning and execute in-request."
        - "No generic POST /v1/executions dispatch route, packages/core queue processor, packages/cli dispatch command, or packages/mcp dispatch tool was found."
        - "PR #2372 is still open and not merged, so it cannot be treated as an already-established reusable release primitive."
        - "Pre-broadcast queue TTL and queued cancellation candidates rely on a direct-execution queue that is not present on the verified surface."
      required_action: rerun the dedicated poll-contract packet without generating replacement candidates
    perplexity:
      status: phase1_and_phase2_received_fact_checked
      retained:
        - Existing executionId + Idempotency-Key + transaction/proof identifiers make a second generic identity expensive to justify.
        - Generic semantic-effect equality is not a valid platform primitive.
        - Permanent reference uniqueness requires explicit release/reuse/retention/supersession semantics.
        - Independent recurrence for a generic caller reference remains weak.
        - Metadata-only reference may be too small/ordinary for the bounty without stronger demand.
        - Phase-2 liveness candidate was rejected because KeeperHub already has public /api/health plus distributed component liveness/metrics.
        - Phase-2 idempotency request-hash candidate was rejected because requestHash conflict handling already exists.
        - Completion callbacks remain research-only: absence found, but no narrow KeeperHub-specific demand yet.
    deepseek:
      status: phase2_received_fact_checked
      retained:
        - Returned RESEARCH PRIMARY FURTHER rather than inventing a source-level candidate without adequate access.
        - REST/MCP parity must be proven with a concrete dropped field; current idempotency_key and gas_limit_multiplier propagation are covered.
        - Top-level direct-status typed errors remain a low-confidence DX observation only.
      corrections:
        - "#2004 is open/accepted and already covers simulate parity across /api/execute/*."
        - "lib/reaper/reap-stale-executions.ts already handles stale pending/running workflow executions."
        - "#2425 is open/accepted/confirmed and already owns a chain/function-set invariant gap."
    grok:
      status: phase2_received_and_fact_checked
      effect: one narrow primary survives fact-check; not filed yet
      retained:
        - Direct status computes X-Poll-Interval-Hint from the server terminal set and sends it only as an HTTP header.
        - get_direct_execution_status consumes only the JSON body through callApi and JSON.stringify, so MCP does not receive the poll hint.
        - Agent-facing docs explicitly tell get_direct_execution_status callers to honor X-Poll-Interval-Hint and treat 0 as terminal.
        - No matching open/closed issue or PR was found for surfacing this poll contract through MCP/body.
        - Maintainer guidance in closed issue #2058 says MCP/REST response shapes are intended to align and concrete field mismatches should be filed separately.
      corrections:
        - "Do not generalize to all JSON clients; ordinary HTTP clients can read headers. The hard proven gap is MCP/tool-result visibility."
        - "Do not include 202 write envelopes in v1 unless cross-examination proves they are necessary; the minimal proven defect is status polling."
        - "The n8n header-precedence claim was not independently verified in this fact-check and is not needed for promotion."
      primary: mcp_direct_status_poll_contract
    kimi_pre_packet:
      status: received_before_targeted_packet_fact_checked_invalid_as_cross_exam
      effect: no candidate promoted; Grok provisional primary unchanged
      proposed_primary: contract_code_hash_admission_guardrail
      corrections:
        - "#2408 is closed/completed, not open; PR #2446 merged the docs scope and closed the issue."
        - "Current KeeperHub simulateContractCall does not return snapshot.contractCodeSha256 or any contract-code hash."
        - "ProofPulse computes contractCodeSha256 client-side from its own eth_getCode RPC response using Node crypto SHA-256 before calling KeeperHub."
        - "The external workaround is real evidence of a user need, but it is not evidence that KeeperHub already exposes the hash building block."
        - "#2503 is an active needs-discussion maintainer/core-team thread about caller expectations versus executed-call verification; the code-hash proposal is adjacent and should not be filed without resolving overlap."
      disposition: research_only_do_not_file
    kimi_final:
      status: targeted_poll_contract_cross_exam_valid_fact_checked
      effect: confirms status-body-wide; no fatal product-boundary objection
      final_classification: PROMOTE_STATUS_BODY_WIDE
      strongest_objection: poll hint is transport metadata and should remain header-only
      fatal: false
      correction:
        - "docs/api/executions.md lower-bound wording is workflow-specific and must not be used as direct-execution evidence."
      retained:
        - Direct agent docs require get_direct_execution_status callers to honor X-Poll-Interval-Hint; MCP cannot observe that header.
        - Body plus header can share one computed pollIntervalHint value, avoiding policy re-derivation in MCP.
        - Docs-only would remove the impossible instruction but leave MCP unable to observe server-directed cadence.
    kimi:
      status: received_and_fact_checked
      retained:
        - Permanent fail-closed execution references leak Tender-style business semantics into KeeperHub.
        - Permanent binding conflicts with KeeperHub's definite-failure release path under #1840/PR #2372.
        - "#2495/#2552 already provides a scoped durable runKey where platform-owned identity is concretely justified."
        - KeeperHub stable-key documentation already covers much of deterministic retry identity.
        - Cross-route reference scoping is unresolved and weakens the generic proposal.
      corrections:
        - "#2408 is closed/completed, accepted/confirmed, and cannot be taken as our new bounty issue."
        - "PR #2446 merged the accepted docs half and closed #2408."
        - "The execution-level softened-error carrier/analytics remainder was explicitly retained by KeeperHub core-team discussion."

