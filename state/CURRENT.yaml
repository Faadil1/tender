project: Tender
branch: main
current_gate: GATE_8_PRODUCT_QA_DEMO_AND_SUBMISSION
category: economic clearing for accepted work
north_star: "Accepted once. Owed once. Settled once."

repository:
  canonical: https://github.com/Faadil1/tender
  live: https://tender-settlement.faadil-casecraft.workers.dev

product_thesis:
  - Acceptance evidence proves what work was accepted.
  - Tender determines whether that acceptance creates one economic obligation and gives it deterministic identity.
  - KeeperHub performs value-moving execution when explicitly authorized/enabled.
  - Tender preserves the causal record with a Tender Receipt plus independent chain proof.
  - Tender remains above KeeperHub: obligation existence/identity is not execution transport identity.

