category: economic clearing for accepted work
north_star: "Accepted once. Owed once. Settled once."

product_thesis:
  - GitHub or another acceptance adapter proves what work was accepted.
  - Tender determines whether that acceptance creates one economic obligation and gives it deterministic identity.
  - KeeperHub performs value-moving settlement when explicitly enabled and authorized.
  - Tender Receipt plus independent chain evidence preserve the causal settlement record.
  - Public judge proof is non-value-moving; authenticated operator runtime is write-enabled.

