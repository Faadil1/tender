operator_invariants:
  - Bearer authentication required.
  - Locked precommitted policy required before acceptance-derived obligation.
  - Explicit initial_claim authorization required for normal settlement.
  - Corrective claims require exact linked authorization.
  - Claim-level settlement reservation is atomic in the Durable Object.
  - Two runtime instances cannot both execute the same first-time Claim.
  - Workflow mode must fail closed without a strong store.

