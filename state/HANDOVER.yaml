      status: phase2_received_fact_checked
      effect: no candidate promoted; direct execution typed failure status remains RESEARCH ONLY
      strongest_supported_points:
        - No concrete recurring caller harm or repeated workaround was found for nested result.errorClass/result.rejection.
        - The immediate ExecuteResponse versus durable status.result asymmetry is plausibly intentional.
        - API symmetry alone does not justify top-level promotion.
        - No generic retryable field without a stable cross-action source of truth.
      fact_check:
        - "#2206 is closed; PR #2213 merged the protocol-write ExecuteResponse envelope."
        - "Current staging already returns executionId/status for protocol writes."
        - "PR #2528 is separate MCP simulate-response documentation/DX work."
    gemini:
      status: targeted_poll_contract_cross_exam_valid_fact_checked
      effect: Grok provisional primary strengthened; preferred fix is status-body-wide
      final_classification: PROMOTE_STATUS_BODY_WIDE
      strongest_supported_points:
        - "MCP drops success-response headers and get_direct_execution_status returns only body JSON."
        - "Agent docs require that MCP caller to honor X-Poll-Interval-Hint; 0 means terminal."
        - "#2058 says MCP execute-tool response shapes are meant to match REST bodies and concrete mismatches should be separate issues."
        - "Adding pollIntervalHint to ExecutionStatusResponse is additive and avoids MCP-only synthesized shape."
        - "Route already computes one pollIntervalHint value; body and header can share it."
      fact_check_corrections:
        - "Lower-bound status-list language is in docs/api/executions.md, not direct-execution.md."
        - "Do not attribute header-only design to oversight; PR #1526 intent is not proven."
      required_test: "body pollIntervalHint equals X-Poll-Interval-Hint numeric value; 0 iff server terminal set says terminal."
      previous_invalid_pass_note:
      strongest_supported_points_from_earlier_pass:
        - KeeperHub should not own Tender-style permanent business identity.
        - Universal semantic EVM effect fingerprinting is not credible.
        - Permanent reference uniqueness creates difficult retry/lifecycle semantics.
        - Metadata-only caller correlation is simpler but needs independent demand.
      latest_pass_fact_check:
        - "Direct execution is not a delayed QUEUED worker-dispatch pipeline on current staging."
        - "directExecutions is an audit/state row: pending -> running -> completed/failed/unconfirmed; routes mark running and execute in the request path."
        - "The proposed /v1/executions and packages/core|cli|mcp dispatch files were not found."
        - "PR #2372 remains open, not merged."
        - "expires_at TTL and queued cancel therefore do not survive as current direct-execution bounty candidates."
      next: "Rerun the dedicated MCP poll-contract packet without generating replacement candidates."
    perplexity:
      status: phase1_and_phase2_received_fact_checked
      effect: enforcing candidate moved to stop_do_not_file
      strongest_supported_points:
        - Existing executionId + Idempotency-Key + transaction/proof identifiers make another identity expensive to justify.
        - Generic semantic-effect equality is unsafe.
        - Permanent uniqueness requires explicit reuse/release/retention/supersession lifecycle.
        - Generic caller-reference recurrence is not yet independently evidenced strongly enough.
        - Metadata-only caller reference may be too ordinary/small for this bounty.
        - Phase-2 proposed engine-liveness endpoint does not survive repo verification: KeeperHub already exposes /api/health plus distributed liveness/metrics.
        - Request-hash idempotency validation already exists with 409 conflict semantics.
        - Completion callback/webhook remains research-only, not promoted.
    deepseek:
      status: phase2_received_fact_checked
      effect: no candidate promoted
      strongest_supported_points:
        - Current source already carries MCP idempotency_key and gas_limit_multiplier propagation plus regression tests.
        - "#2004 already owns simulate parity across /api/execute/*."
        - "stale pending/running execution cleanup already exists in lib/reaper/reap-stale-executions.ts."
        - "#2425 already owns a chain/function-set coverage gap."
        - "direct execution status typed-error normalization remains research-only because errorClass/rejection are already persisted inside result/output on failure paths."
    grok:
      status: phase2_received_fact_checked
      effect: provisional primary survives; do not file yet
      primary: mcp_direct_status_poll_contract
      strongest_supported_points:
        - X-Poll-Interval-Hint is the documented direct-execution terminality/cadence contract.
        - get_direct_execution_status discards HTTP headers and returns only JSON body text to MCP.
        - Agent docs tell MCP callers to use a header the MCP tool cannot expose.
        - #2058 maintainer guidance invites separate filing for concrete MCP/REST mismatches.
      fact_check_corrections:
        - Narrow the defect to MCP visibility; ordinary REST clients can read headers.
        - Do not require adding the hint to all 202 write envelopes in v1.
        - Do not rely on the unverified n8n claim.
    kimi_pre_packet:
      status: received_before_targeted_packet_fact_checked_invalid_as_cross_exam
      effect: code-hash guardrail retained only as research hypothesis; Grok primary unchanged
      fact_check:
        - "#2408 is closed/completed."
        - "KeeperHub simulate.ts has no contractCodeSha256 or snapshot hash field."
        - "ProofPulse computes runtime bytecode SHA-256 locally from eth_getCode before KeeperHub execution."
        - "#2503 is active needs-discussion and under core-team shape review for adjacent expectation/verification semantics."
      next: "Do not file code-hash guardrail; rerun Kimi on the dedicated poll-contract packet."
    kimi_final:
      status: targeted_poll_contract_cross_exam_valid_fact_checked
      effect: confirms status-body-wide; no fatal product-boundary objection
      final_classification: PROMOTE_STATUS_BODY_WIDE
      correction:
        - "docs/api/executions.md lower-bound wording is workflow-specific; do not use it as direct-execution evidence."
      filing_attempt: "manual filing succeeded after GitHub integration returned 403 for automated creation"
      next: "Wait for KeeperHub triage on #2560; no implementation before accepted or a maintainer-amended accepted plan."
    kimi:
      status: received_fact_checked
      effect: rejection strengthened; "#2408 alternative rejected as occupied"
      strongest_supported_points:
        - Permanent fail-closed references import domain/business semantics into KeeperHub.
        - The proposal conflicts with KeeperHub's definite-failure release path under "#1840/PR #2372".
        - "#2495/#2552 already demonstrates the scoped runKey pattern where durable platform identity is justified."
        - KeeperHub stable-key docs already answer much of deterministic retry identity.
        - Cross-route scoping remains an unresolved architecture problem.
      fact_check:
        - "#2408 is closed/completed with accepted and confirmed labels."
        - "PR #2446 merged the accepted documentation scope and closed #2408."
        - "Maintainer triage says the execution-level field/analytics carrier is being settled with the core team and is not blocked on the contributor."
        - "Do not create a duplicate issue for the remaining softened-error execution-level work."

