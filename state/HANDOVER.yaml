project: Tender
summary: >
  Tender is settlement infrastructure for accepted software contributions.
  GitHub proves what work was accepted. Tender determines what is economically
  owed. KeeperHub proves it was settled.
core:
  primitive: Tender Claim
  invariant: one accepted obligation -> one settlement
  signature_artifact: Tender Receipt
  replay_statement: same claim -> ALREADY_SETTLED -> $0 additional movement
resume_rule: Preserve current Git history and canonical evidence. Do not recreate or rerun completed value-moving proof.
canonical_repository: https://github.com/Faadil1/tender
current_state:
  branch: main
  remote_history_pushed: true
  canonical_live_proof_complete: true
  judge_ui_bound_to_canonical_evidence: true
  cloudflare_deploy_prepared: true
  uncommitted_work_expected: false
important_files:
  - src/domain/types.ts
  - src/domain/identity.ts
  - src/domain/settlementEngine.ts
  - src/adapters/keeperhub.ts
  - scripts/replay-harness.ts
  - scripts/live-proof.ts
  - .github/workflows/tender-preflight-diagnostic.yml
  - .github/workflows/tender-live-proof.yml
  - .github/workflows/verify.yml
  - evidence/settlement-replay-harness.json
  - evidence/keeperhub-calibration.json
  - evidence/live-proof.json
  - public/live-proof.json
  - public/index.html
  - public/main.js
  - public/styles.css
  - wrangler.jsonc
  - DEPLOYMENT.md
  - docs/WINNING-INTELLIGENCE.md
  - docs/PRD.md
  - docs/ARCHITECTURE.md
  - docs/DESIGN-DIRECTION.md
  - SUBMISSION.md
gates:
  GATE_0: completed_research
  GATE_1: completed_product_thesis
  GATE_2: completed_architecture
  GATE_3: completed_core_settlement_engine
  GATE_4: completed_github_acceptance_adapter
  GATE_5: completed_keeperhub_calibration
  GATE_6: completed_replay_harness
  GATE_6_5: completed_live_proof_hardening_and_preflight
  GATE_7: completed_tender_caused_live_proof
  GATE_7_5: completed_judge_facing_evidence_binding_and_cloudflare_prep
  GATE_8: pending_publish_qa_video_and_submission_lock
