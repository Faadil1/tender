keeperhub_bounty_handoff:
  status: source_level_candidate_validation_complete
  main_track_and_bounty_are_separate_workstreams: true
  research_doc: docs/KEEPERHUB-BOUNTY-INTELLIGENCE.md
  keeperhub_contribution_rule: "Issue first -> Reason/Scope/Plan -> wait for accepted -> implement -> PR to staging"
  key_research_findings:
    - Previous winners were rewarded for production seriousness, reusable primitives, real usage, tests, and reproducible platform feedback rather than shallow integrations.
    - Current submissions already crowd verified settlement, idempotency, preflight firewalls, durable settlement intents, Merkle audit, and generic framework gateways.
    - KeeperHub issues repeatedly expose a gap between transient execution/request state and longer-lived logical identity/reconciliation.
    - OpenZeppelin Relayer issues show the same broader class of nonce, stale-receipt, and ambiguous execution-state failures.
  tender_unique_white_space: "economic obligation existence + deterministic obligation identity derived from accepted work"
  provisional_bounty_candidate:
    name: Effect-Bound Execution Reference
    status: feasible_pending_final_overlap_and_external_review
    core: "durable caller reference bound to exact request/effect identity and original execution/proof"
    same_reference_same_effect: resolve original execution/proof
    same_reference_changed_effect: fail closed
    keeperhub_boundary: execution request/effect identity only
    tender_boundary: obligation existence, policy, acceptance, correction semantics
    source_findings:
      - directExecutions already stores a durable organization-scoped audit row with redacted input, lifecycle status, tx hash, receipts, output, gas/cost and timestamps
      - status lookup is currently by internal executionId and has no caller-defined durable reference
      - checkAndReserveExecution inserts the direct execution atomically at the value-cap reservation boundary
      - idempotency uses organization+scope+key+deterministic request hash and expires completed/failed records after 24 hours
      - the candidate should compose with idempotency, not extend its TTL globally
    mergeability_bias:
      - Start with exact-request binding in v1 rather than universal semantic effect normalization.
      - Reserve reference atomically with the direct execution row.
      - Scope reference to organization, not API key.
      - Keep Idempotency-Key semantics unchanged.
    open_questions:
      - final field name
      - exact request hash vs normalized effect hash
      - lookup route shape
      - retention semantics
      - transfer-only vs all direct write routes for v1
    overlap_status: exact-term issue search clean; final final-name issue/PR sweep still required
    issue_filed: false
    code_started: false
  known_no_go_overlaps:
    - "#2495 web3/disburse partial payout resume"
    - "#2395 receipt export"
    - "#2503 executed-call verification"
    - "#2398 permission cards"
    - "#2318 multi-model consensus"
    - "#2479 generic EVM sign-and-hold"
    - generic simulator/firewall
    - generic framework connector
    - generic Merkle audit
  external_llm_gate:
    status: planned_not_executed
    planned_models:
      - Claude: maintainer/mergeability critique
      - Gemini: API/schema/migration critique
      - Grok: uniqueness/duplicate/adversarial critique
    note: no direct provider connector is available in this chat; do not claim those reviews occurred until outputs are obtained
  next_steps:
    - Finalize candidate naming and repeat open/closed issue + PR overlap search with those names.
    - Draft the upstream Reason/Scope/Plan issue using Tender plus independent integrations as recurrence evidence.
    - Prepare/run external-LLM critique packet and synthesize only evidence-backed objections.
    - File only if still distinct.
    - Wait for accepted before any upstream implementation.

