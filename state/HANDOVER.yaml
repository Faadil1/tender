deployment:
  target: Cloudflare Workers Static Assets
  config: wrangler.jsonc
  output_directory: dist/public
  command: npm run deploy:cloudflare
  status: prepared_waiting_for_cloudflare_authorization
measured_proof:
  unit_tests: 13/13
  replay_harness: "10 settlement scenarios replayed · 0 duplicate payouts"
do_not:
  - Do not repeat the manual calibration payment.
  - Do not rerun the canonical value-moving proof without a distinct explicit reason.
  - Do not expose KeeperHub API keys.
  - Do not weaken the product into a generic merge-to-pay or bounty marketplace.
  - Do not replace deterministic Tender Claim identity with GitHub delivery or Action run identity.
next_exact_actions:
  - From an authenticated local clone, git pull and npm run verify.
  - Authorize Cloudflare with npx wrangler login.
  - Run npm run deploy:cloudflare once and capture the workers.dev URL.
  - QA desktop/mobile/reduced-motion and canonical transaction/evidence links.
  - Capture the demo/video from the deployed canonical evidence; do not run another payment.
  - Lock final DoraHacks copy, production URL, demo URL, and repository visibility requirements.
