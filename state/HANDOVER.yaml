    mcp_direct_status_poll_contract:
      status: provisional_primary_survives_fact_check
      note: "MCP get_direct_execution_status cannot expose X-Poll-Interval-Hint even though agent docs require it; #2058 maintainer guidance treats concrete MCP/REST mismatches as separate bugs"
