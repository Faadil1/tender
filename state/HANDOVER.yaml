judge_runtime:
  target: Cloudflare Worker + Static Assets
  public_value_movement: disabled
  endpoints:
    runtime: GET /api/runtime
    proof: GET /api/proof
    replay: POST /api/replay
    claim_verifier: POST /api/claim/verify
    acceptance_packet: GET /api/acceptance-packet
    chain_proof: GET /api/chain-proof
  product_surface:
    - Acceptance Packet explains why the obligation exists.
    - Tender Claim is the normalized deterministic economic fingerprint.
    - Tender Receipt proves the obligation was discharged.
    - Independent chain proof checks the Base Sepolia USDC Transfer rather than trusting KeeperHub self-report alone.
    - Same-vs-altered Claim inspector turns identity and authorization into a judge-visible interaction.
winning_patterns_applied:
  - production seriousness and measured evidence rather than shallow integration
  - reusable core primitives instead of one-off workflow glue
  - deterministic planning and fail-closed behavior
  - independent verification of execution outcome
  - live runtime evidence plus explicit negative-path proof
  - narrow memorable primitive rather than feature-count competition
measured_proof:
  unit_tests: 16/16
  replay_harness: "10 settlement scenarios replayed · 0 duplicate payouts"
do_not:
  - Do not repeat the manual calibration payment.
  - Do not rerun the canonical value-moving proof without a distinct explicit reason.
  - Do not expose KeeperHub API keys.
  - Do not weaken the product into a generic merge-to-pay, bounty marketplace, DeFi firewall, or MCP gateway.
  - Do not give the judge runtime a value-moving execution adapter.
next_exact_actions:
  - Locally restore evidence/settlement-replay-harness.json if npm run verify changed only its generated timestamp.
  - Checkout main, pull latest main, and run npm run verify once.
  - Run npm run deploy:cloudflare to update the existing workers.dev URL.
  - QA /api/runtime, /api/proof, /api/replay, /api/claim/verify, /api/acceptance-packet, and /api/chain-proof.
  - QA clearing desk on desktop/mobile/reduced-motion.
  - If schedule permits, integrate a real live project acceptance event to strengthen the named-project evidence.
  - Lock demo/video and final DoraHacks copy; do not run another payment.

