keeperhub_bounty_handoff:
  status: competitive_scan_expanded_external_review_ready
  main_track_and_bounty_are_separate_workstreams: true
  research_doc: docs/KEEPERHUB-BOUNTY-INTELLIGENCE.md
  external_review_packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
  keeperhub_contribution_rule: "Issue first -> Reason/Scope/Plan -> wait for accepted -> implement -> PR to staging"
  main_track_signal:
    - Current public framing prefers KeeperHub integrated into a live project/product rather than a standalone demo.
    - Strengthen Tender by binding one existing real product/workstream through an acceptance adapter.
  key_research_findings:
    - Previous winners were rewarded for production seriousness, reusable primitives, real usage, tests, reproducible platform feedback, and upstream usefulness.
    - Current submissions already crowd verified settlement, stable references, replay/crash recovery, preflight firewalls, permission-like gating, Merkle audit, and generic execution gateways.
    - KeeperHub issues repeatedly expose a gap between transient request/execution state and durable logical identity/reconciliation.
    - KeeperHub's own docs define Idempotency-Key replay as a 24-hour retry mechanism; after expiry the same key can execute again.
    - Adjacent relayer/automation systems reinforce explicit unknown states, detection/execution separation, and deterministic execution boundaries.
    - Canonical adjacent-system law: never derive durable business truth from a transient transport state.
  tender_unique_white_space: "economic obligation existence + deterministic obligation identity derived from accepted work and locked policy"
  mechanisms_to_adopt_in_tender:
    - authority separation
    - non-terminal unknown/unconfirmed states
    - independent chain proof
    - stable Claim identity separate from execution/retry IDs
    - explicit poll/recovery semantics
    - live-product acceptance adapter
  provisional_bounty_candidate:
    name: Effect-Bound Execution Reference
    status: source_validated_final_name_sweep_clean_pending_external_critique
    core: "durable caller reference bound to exact request identity and original execution/proof"
    same_reference_same_request: resolve original execution/proof without broadcast
    same_reference_changed_request: typed conflict without broadcast
    keeperhub_boundary: execution request/effect identity only
    tender_boundary: obligation existence, policy, acceptance, correction semantics
    source_findings:
      - directExecutions already stores a durable organization-scoped audit row
      - status lookup is currently by internal executionId and has no caller-defined durable reference
      - checkAndReserveExecution inserts the direct execution at the atomic value-cap reservation boundary
      - idempotency uses organization+scope+key+deterministic request hash and expires completed/failed records after 24 hours
      - the candidate should compose with idempotency, not extend its TTL globally
    overlap_sweep:
      date: 2026-09-17
      terms:
        - execution reference
        - effect reference
        - durable reference
        - reference lookup
      issue_direct_duplicate_found: false
      pr_direct_duplicate_found: false
      semantic_overlap_review_still_required: true
    mergeability_bias:
      - Start with exact-request binding in v1 rather than universal semantic effect normalization.
      - Reserve reference atomically with the direct execution row.
      - Scope reference to organization, not API key.
      - Keep Idempotency-Key semantics unchanged.
    open_questions:
      - final field name
      - whether route/action participates in uniqueness scope
      - direct column vs separate binding table
      - lookup route shape
      - retention semantics
      - bounded v1 route set
      - sensitive-reference validation/redaction
    issue_filed: false
    code_started: false
  known_no_go_overlaps:
    - "#2495 web3/disburse partial payout resume"
    - "#2395 receipt export"
    - "#2503 executed-call verification"
    - "#2398 permission cards"
    - "#2318 multi-model consensus"
    - "#2479 generic EVM sign-and-hold"
    - generic simulator/firewall
    - generic framework connector
    - generic Merkle audit
    - generic cross-chain status
  external_llm_gate:
    status: packet_ready_not_executed
    packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
    planned_models:
      - Claude: maintainer/mergeability critique
      - Gemini: API/schema/migration/concurrency critique
      - Grok: uniqueness/duplicate/adversarial critique
    plugin_directory_check: no direct Claude/Gemini/Grok provider integration surfaced in this ChatGPT session
    synthesis_rule: one evidence-backed fatal objection defeats majority agreement
    next_artifact: docs/EXTERNAL-LLM-CRITIQUE-SYNTHESIS.md
  next_steps:
    - Run the critique packet with Claude, Gemini and Grok.
    - Synthesize only evidence-backed objections and scope changes.
    - Draft KeeperHub Reason/Scope/Plan issue only after critique.
    - Re-run final issue/PR overlap immediately before filing.
    - File only if still distinct.
    - Wait for accepted before any upstream implementation.

