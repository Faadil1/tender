project: Tender
summary: >
  Tender is the economic clearing layer for accepted work. Acceptance proves what work became eligible;
  Tender determines whether an economic obligation exists, gives it deterministic identity, and preserves
  exactly-once settlement semantics. KeeperHub is the value-moving executor when explicitly enabled.
  Independent chain proof verifies the canonical settlement without trusting KeeperHub self-report alone.

core:
  category: economic clearing for accepted work
  primitive: Tender Claim
  acceptance_artifact: Acceptance Packet
  settlement_artifact: Tender Receipt
  invariant: one accepted obligation -> one settlement
  north_star: "Accepted once. Owed once. Settled once."
  replay_statement: same claim -> ALREADY_SETTLED -> 0 additional KeeperHub executions -> $0 movement
  mutation_statement: changed economics -> NEW_CLAIM -> REQUIRES_ACCEPTANCE -> $0 movement

canonical_repository: https://github.com/Faadil1/tender
live_url: https://tender-settlement.faadil-casecraft.workers.dev
current_gate: GATE_8_PRODUCT_QA_DEMO_AND_SUBMISSION
resume_rule: Preserve canonical evidence and do not rerun completed value-moving proof.

