operator_invariants:
  - Bearer authentication required.
  - Locked precommitted policy required before acceptance-derived obligation.
  - Explicit initial_claim authorization required for normal settlement.
  - Corrective claims require exact linked authorization.
  - Claim-level settlement reservation is atomic in the Durable Object.
  - Two runtime instances cannot both execute the same first-time Claim.
  - Workflow mode must fail closed without a strong store.

ui_ux_handoff:
  collaborator: Benita
  status: review_and_redesign_requested
  freedom:
    - Product does not need to remain a single page.
    - Navigation, page hierarchy, flows, visual system, and interactions may be rethought.
  preserve:
    - Acceptance -> Claim -> Authorization -> Settlement -> Receipt semantics.
    - Judge-visible replay and mutation proof.
    - Safety/fail-closed states.
    - Domain-native economic clearing language.
    - Clear distinction between public proof surface and authenticated operator surface.

keeperhub_bounty_handoff:
  status: multi_llm_whitespace_discovery_all_reviewers_including_deepseek
  main_track_and_bounty_are_separate_workstreams: true
  research_doc: docs/KEEPERHUB-BOUNTY-INTELLIGENCE.md
  external_review_packet: docs/EXTERNAL-LLM-CRITIQUE-PACKET.md
  external_review_synthesis: docs/EXTERNAL-LLM-CRITIQUE-SYNTHESIS.md
  whitespace_packet: docs/KEEPERHUB-WHITESPACE-MULTI-LLM-PACKET.md
  keeperhub_contribution_rule: "Issue first -> Reason/Scope/Plan -> wait for accepted -> implement -> PR to staging"

  external_review_results:
    gemini:
      status: received_fact_checked
      effect: enforcing Effect-Bound Execution Reference demoted
      strongest_supported_points:
        - KeeperHub should not own Tender-style permanent business identity.
        - Universal semantic EVM effect fingerprinting is not credible.
        - Permanent reference uniqueness creates difficult retry/lifecycle semantics.
        - Metadata-only caller correlation is simpler but needs independent demand.
    perplexity:
      status: received_fact_checked
      effect: enforcing candidate moved to stop_do_not_file
      strongest_supported_points:
        - Existing executionId + Idempotency-Key + transaction/proof identifiers make another identity expensive to justify.
        - Generic semantic-effect equality is unsafe.
        - Permanent uniqueness requires explicit reuse/release/retention/supersession lifecycle.
        - Generic caller-reference recurrence is not yet independently evidenced strongly enough.
        - Metadata-only caller reference may be too ordinary/small for this bounty.
    kimi:
      status: received_fact_checked
      effect: rejection strengthened; "#2408 alternative rejected as occupied"
      strongest_supported_points:
        - Permanent fail-closed references import domain/business semantics into KeeperHub.
        - The proposal conflicts with KeeperHub's definite-failure release path under "#1840/PR #2372".
        - "#2495/#2552 already demonstrates the scoped runKey pattern where durable platform identity is justified."
        - KeeperHub stable-key docs already answer much of deterministic retry identity.
        - Cross-route scoping remains an unresolved architecture problem.
      fact_check:
        - "#2408 is closed/completed with accepted and confirmed labels."
        - "PR #2446 merged the accepted documentation scope and closed #2408."
        - "Maintainer triage says the execution-level field/analytics carrier is being settled with the core team and is not blocked on the contributor."
        - "Do not create a duplicate issue for the remaining softened-error execution-level work."

  candidate_board:
    effect_bound_execution_reference:
      status: stop_do_not_file
    callerReference_metadata_only:
      status: hold_low_priority
      note: technically plausible correlation-only metadata, but weak bounty signal until independent recurrence is proven
    broad_broadcast_outcome_reconciliation:
      status: no_go_as_new_candidate
      note: strongest sub-problems are already fixed/closed or actively owned
    softened_error_execution_contract:
      status: no_go_occupied
      note: "#2408 closed; PR #2446 merged; execution-level remainder retained by core team"

  verified_overlap_and_ownership:
    - "#1840 open accepted confirmed; PR #2372 open mergeable not merged"
    - "#2373 open confirmed needs-discussion; active implementation/tests already exist"
    - "#2020 closed completed; PR #2162 merged"
    - "#2177 closed completed"
    - "#2374 closed completed; PR #2386 merged"
    - "#1979 closed completed"
    - "#2408 closed completed accepted confirmed; PR #2446 merged"
    - "#2495 open accepted confirmed; PR #2552 open mergeable not merged"

  no_go_bounty_areas:
    - "#2373 asynchronous idempotency release"
    - "#2495/#2552 disbursement/partial payout resume"
    - "#2408 softened-error execution reporting"
    - generic broadcast-outcome/reconciliation layer
    - generic sequential simulator/firewall
    - receipt export
    - executed-call verification
    - permission cards
    - multi-model consensus
    - generic EVM sign-and-hold
    - generic framework adapters
    - generic Merkle audit
    - generic cross-chain status
    - universal semantic-effect fingerprinting

  reviewer_roster:
    - Claude: maintainer / mergeability / hidden coupling
    - Gemini: systems / API / schema / concurrency
    - Grok: adversarial duplicate / competition / recurrence
    - Perplexity: evidence / adjacent systems / independent recurrence
    - Kimi: product boundary / semantics / DX
    - DeepSeek: source-level reliability / cross-surface parity / race windows
    - ChatGPT: source fact-check / cross-model synthesis / final overlap gate
  synthesis_rule: one evidence-backed fatal objection defeats majority agreement
  next_bounty_search_rule:
    - Do not rescue the rejected reference idea.
    - Do not take "#2408"; it is closed and its remaining implementation direction is owned by the core team.
    - Use the full reviewer roster to discover a different narrow whitespace candidate.
    - Candidate must be independently evidenced, unclaimed, small, backward-compatible, testable and useful beyond Tender.
    - If no candidate survives, skip the bounty rather than duplicate active work.

remaining_work:
  - Let Benita continue UI/UX redesign against the verified runtime.
  - Bind Tender to one real existing product/workstream via an acceptance adapter for main-track evidence.
  - QA redesigned product on desktop/mobile and reduced motion.
  - QA loading/error/failure states and navigation after UI changes.
  - Lock <=3 minute demo narrative and video.
  - Final submission copy and packaging.
  - Complete the full multi-LLM whitespace review and fact-check every surviving candidate.

runtime_lock_rule:
  - Treat settlement/runtime/proof behavior as locked unless a real bug appears.
  - Do not spend remaining time adding speculative runtime features.
  - KeeperHub bounty research may proceed in parallel but must not alter Tender's product semantics to fit the bounty.

do_not:
  - Do not repeat the manual calibration payment.
  - Do not rerun the canonical value-moving proof without a distinct explicit reason.
  - Do not expose TENDER_OPERATOR_TOKEN or KeeperHub API keys.
  - Do not switch OPERATOR_SETTLEMENT_MODE to workflow during current QA/demo work.
  - Do not weaken Tender into generic merge-to-pay or a bounty marketplace.
  - Do not add value-moving execution to the public judge runtime.
  - Do not duplicate an active or closed KeeperHub issue simply to enter the bounty.
  - Do not implement KeeperHub bounty code before an upstream issue is accepted.

next_exact_actions:
  - Keep Tender runtime/proof locked.
  - Continue Benita UI/UX work and main-track live-product binding.
  - Run docs/KEEPERHUB-WHITESPACE-MULTI-LLM-PACKET.md through Claude, Gemini, Grok, Perplexity, Kimi and DeepSeek.
  - Give DeepSeek the source-level reliability role defined in the packet.
  - Fact-check all outputs against current KeeperHub source/issues/PRs.
  - Cross-examine duplicate claims before selecting any primary candidate.
  - File nothing upstream until a distinct, unclaimed, evidence-backed candidate survives.
