project: Tender
summary: >
  Tender is the economic clearing layer for accepted work. An acceptance adapter proves what work was accepted; Tender determines whether that acceptance creates one deterministic economic obligation; KeeperHub settles it; independent chain evidence verifies what landed.
core:
  category: economic clearing for accepted work
  primitive: Tender Claim
  invariant: one accepted obligation -> one settlement
  signature_artifact: Tender Receipt
  acceptance_artifact: Acceptance Packet
  north_star: "Accepted once. Owed once. Settled once."
  replay_statement: same claim -> ALREADY_SETTLED -> 0 additional executions -> $0 movement
  mutation_statement: changed economics -> NEW_CLAIM -> REQUIRES_ACCEPTANCE -> $0 movement
resume_rule: Preserve current Git history and canonical evidence. Do not recreate or rerun completed value-moving proof.
canonical_repository: https://github.com/Faadil1/tender
