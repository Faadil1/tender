    - "#2495 open accepted confirmed; PR #2552 open mergeable not merged"

  no_go_bounty_areas:
    - "#2373 asynchronous idempotency release"
    - "#2495/#2552 disbursement/partial payout resume"
    - "#2408 softened-error execution reporting"
    - generic broadcast-outcome/reconciliation layer
    - generic sequential simulator/firewall
    - receipt export
    - executed-call verification
    - permission cards
    - multi-model consensus
    - generic EVM sign-and-hold
    - generic framework adapters
    - generic Merkle audit
    - generic cross-chain status
    - universal semantic-effect fingerprinting

  reviewer_roster:
    - Claude: maintainer / mergeability / hidden coupling
    - Gemini: systems / API / schema / concurrency
    - Grok: adversarial duplicate / competition / recurrence
    - Perplexity: evidence / adjacent systems / independent recurrence
    - Kimi: product boundary / semantics / DX
    - DeepSeek: source-level reliability / cross-surface parity / race windows
    - ChatGPT: source fact-check / cross-model synthesis / final overlap gate
  synthesis_rule: one evidence-backed fatal objection defeats majority agreement
  next_bounty_search_rule:
    - Do not rescue the rejected reference idea.
    - Do not take "#2408"; it is closed and its remaining implementation direction is owned by the core team.
    - Use the full reviewer roster to discover a different narrow whitespace candidate.
    - Candidate must be independently evidenced, unclaimed, small, backward-compatible, testable and useful beyond Tender.
    - If no candidate survives, skip the bounty rather than duplicate active work.

remaining_work:
  - Let Benita continue UI/UX redesign against the verified runtime.
  - Bind Tender to one real existing product/workstream via an acceptance adapter for main-track evidence.
  - QA redesigned product on desktop/mobile and reduced motion.
  - QA loading/error/failure states and navigation after UI changes.
  - Lock <=3 minute demo narrative and video.
  - Final submission copy and packaging.
  - Complete the full multi-LLM whitespace review and fact-check every surviving candidate.

runtime_lock_rule:
  - Treat settlement/runtime/proof behavior as locked unless a real bug appears.
  - Do not spend remaining time adding speculative runtime features.
  - KeeperHub bounty research may proceed in parallel but must not alter Tender's product semantics to fit the bounty.

do_not:
  - Do not repeat the manual calibration payment.
  - Do not rerun the canonical value-moving proof without a distinct explicit reason.
  - Do not expose TENDER_OPERATOR_TOKEN or KeeperHub API keys.
  - Do not switch OPERATOR_SETTLEMENT_MODE to workflow during current QA/demo work.
  - Do not weaken Tender into generic merge-to-pay or a bounty marketplace.
  - Do not add value-moving execution to the public judge runtime.
  - Do not duplicate an active or closed KeeperHub issue simply to enter the bounty.
  - Do not implement KeeperHub bounty code before an upstream issue is accepted.

next_exact_actions:
  - Keep Tender runtime/proof locked.
  - Continue Benita UI/UX work and main-track live-product binding.
  - Re-run Gemini strictly against docs/KEEPERHUB-POLL-CONTRACT-CROSS-EXAMINATION.md; no replacement-candidate generation.
  - Run Kimi on the same packet.
  - Force both to test MCP-only vs status-body-wide vs docs-only fixes.
  - Fact-check both reviews before filing anything upstream.
  - Fact-check all outputs against current KeeperHub source/issues/PRs.
  - Cross-examine duplicate claims before selecting any primary candidate.
  - File nothing upstream until a distinct, unclaimed, evidence-backed candidate survives.
