  - Configure operator token and KeeperHub secrets server-side only.
  - Pull latest main and rerun npm run verify once.
  - Redeploy existing Cloudflare Worker URL.
  - QA public and authenticated operator endpoints plus desktop/mobile/reduced-motion.
  - Finalize demo video and DoraHacks submission copy without rerunning canonical payment.
