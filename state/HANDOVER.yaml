project: Tender
summary: >
  Tender is the economic clearing layer for accepted work. Acceptance proves what work
  became eligible; Tender determines whether an economic obligation exists, gives it one
  deterministic identity, and preserves exactly-once settlement semantics. KeeperHub is
  the value-moving executor when explicitly enabled. Independent chain proof verifies the
  canonical settlement without trusting KeeperHub self-report alone.

core:
  category: economic clearing for accepted work
  primitive: Tender Claim
  acceptance_artifact: Acceptance Packet
  settlement_artifact: Tender Receipt
  invariant: one accepted obligation -> one settlement
  north_star: "Accepted once. Owed once. Settled once."
  replay_statement: same claim -> ALREADY_SETTLED -> 0 additional KeeperHub executions -> $0 movement
  mutation_statement: changed economics -> NEW_CLAIM -> REQUIRES_ACCEPTANCE -> $0 movement

