  accepted_work_id: 3c19bd869e9223bdb1d353a864f1818ee6c2e871
  claim_id: tclaim_94eb021e7894252897176543cc9d7b49
  receipt_id: treceipt_94eb021e7894252897176543cc9d7b49
  execution_id: 7k14qt2a1989rrc5r370d
  transaction_hash: 0x269f77504e421e16ee3193de5bb5c56a55618a4fc210f5ccba2dabf73d18e5db
  settlement_status: SETTLED
  replay_status: ALREADY_SETTLED
  additional_keeperhub_executions: 0
  additional_movement: "$0"
judge_runtime:
  public_value_movement: disabled
  signature_interactions:
    - same claim -> ALREADY_SETTLED -> $0
    - altered economics -> REQUIRES_ACCEPTANCE -> $0
operator_runtime:
  implemented_operations:
    - create_and_lock_policy
    - ingest_acceptance
    - create_obligation
    - authorize_exact_candidate_claim
    - settle
    - reconcile
    - supersede_unsettled_claim
    - create_corrective_claim
  authorization_properties:
    - exact authorizedClaimId binding
    - linkedClaimId binding
    - one-time atomic consumption contract
    - sticky REQUIRES_ACCEPTANCE without valid stored authorization
  policy_properties:
    - policyDigest required for operator-created policies
    - policy must be locked before acceptance
    - locked versions cannot be overwritten
  storage:
    kv: dev_or_non_value_moving_only
    value_moving_requirement: strongly_consistent_store
    production_value_moving_status: blocked_until_strong_store_bound
safety:
  canonical_payment_rerun: false
  no_new_value_moving_execution: true
  keeperhub_secrets_exposed: false
  public_runtime_broadcast_enabled: false
do_not:
  - Do not repeat calibration or canonical payment.
  - Do not expose KeeperHub or operator secrets.
  - Do not enable KeeperHub workflow mode against Workers KV-only state.
  - Do not rewrite settled receipts; use linked corrective claims.
next_exact_actions:
