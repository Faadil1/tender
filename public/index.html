<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0910" />
    <meta
      name="description"
      content="Tender turns accepted work into one deterministic economic obligation, settles it once through KeeperHub, and preserves the proof."
    />
    <title>Tender — Accepted once. Owed once. Settled once.</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Tender home">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-word">Tender</span>
        </a>

        <nav class="desktop-nav" aria-label="Primary">
          <a href="/" data-nav="/">Home</a>
          <a href="/obligation" data-nav="/obligation">Case</a>
          <a href="/proof" data-nav="/proof">Proof</a>
          <a href="/lab" data-nav="/lab">Lab</a>
        </nav>

        <div class="public-lock" title="This public surface cannot broadcast another payment">
          <span class="lock-dot" aria-hidden="true"></span>
          Public proof · no broadcast
        </div>
      </header>

      <main id="app" class="app-main" tabindex="-1" aria-live="polite">
        <section class="loading-state">
          <span class="registration-mark" aria-hidden="true"></span>
          <p>Registering canonical proof…</p>
        </section>
      </main>

      <footer class="site-footer">
        <span>Tender</span>
        <span>Accepted → Claim → Settlement → Receipt</span>
        <a href="/proof#evidence">Technical evidence</a>

    <nav class="mobile-nav" aria-label="Primary mobile">
      <a href="/" data-nav="/">
        <span aria-hidden="true">⌂</span>
        Home
      </a>
      <a href="/obligation" data-nav="/obligation">
        <span aria-hidden="true">Ⅰ</span>
        Case
      </a>
      <a href="/proof" data-nav="/proof">
        <span aria-hidden="true">◎</span>
        Proof
      </a>
      <a href="/lab" data-nav="/lab">
        <span aria-hidden="true">≠</span>
        Lab
      </a>
    </nav>

    <script type="module" src="/main.js"></script>
  </body>
</html>
