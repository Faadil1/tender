name: Tender Preflight Diagnostic

on:
  workflow_dispatch:
    inputs:
      recipient_wallet:
        description: Recipient wallet for read-only KeeperHub simulation
        required: true
      amount_usdc:
        description: USDC amount for read-only KeeperHub simulation
        required: true
        default: "0.01"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEEPERHUB_API_KEY: ${{ secrets.KEEPERHUB_API_KEY }}
      KEEPERHUB_BASE_URL: ${{ secrets.KEEPERHUB_BASE_URL }}
      KEEPERHUB_WORKFLOW_ID: ${{ secrets.KEEPERHUB_WORKFLOW_ID }}
      TENDER_RECIPIENT_WALLET: ${{ inputs.recipient_wallet }}
      TENDER_AMOUNT_USDC: ${{ inputs.amount_usdc }}
    steps:
      - name: Read-only KeeperHub diagnostics — never broadcast
        shell: bash
        run: |
          node <<'NODE'
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is required`);
            return value;
          };

          const rawBase = required("KEEPERHUB_BASE_URL").replace(/\/+$/, "");
          const base = rawBase.replace(/\/api$/i, "");
          const workflowId = required("KEEPERHUB_WORKFLOW_ID");
          const apiKey = required("KEEPERHUB_API_KEY");
          const recipient = required("TENDER_RECIPIENT_WALLET");
          const amount = required("TENDER_AMOUNT_USDC");
          const auth = { Authorization: `Bearer ${apiKey}` };

          const read = async (label, url) => {
            const res = await fetch(url, { headers: auth });
            const text = await res.text();
            let body = text;
            try { body = JSON.parse(text); } catch {}
            console.log(`${label}: HTTP ${res.status} ${res.statusText}`);
            console.log(typeof body === "string" ? body.slice(0, 12000) : JSON.stringify(body, null, 2).slice(0, 12000));
            return { ok: res.ok, status: res.status, body };
          };

          console.log(`Base URL normalization: ${rawBase === base ? "unchanged" : "removed trailing /api"}`);
          console.log(`Target workflow ID: ${workflowId}`);
          console.log(`Recipient: ${recipient}`);
          console.log(`Amount: ${amount}`);
          console.log("Mode: read-only organization-scope diagnostic. No /execute endpoint is called.");

          const keys = await read("Auth probe /api/keys", `${base}/api/keys`);
          if (!keys.ok) {
            console.error("AUTH_PROBE_FAILED: the kh_ key is invalid, revoked, or not accepted as an organization key.");
            process.exit(1);
          }

          const workflows = await read("Workflow list /api/workflows", `${base}/api/workflows`);
          if (!workflows.ok) {
            console.error("WORKFLOW_LIST_FAILED: the key authenticated but cannot list organization workflows.");
            process.exit(1);
          }

          const items = Array.isArray(workflows.body) ? workflows.body : (workflows.body?.items ?? []);
          const visible = items.map((w) => ({ id: w.id, name: w.name, projectId: w.projectId ?? null }));
          console.log("Visible workflows summary:");
          console.log(JSON.stringify(visible, null, 2));

          const match = visible.find((w) => w.id === workflowId);
          if (!match) {
            console.error(`ORG_SCOPE_MISMATCH: target workflow ${workflowId} is not visible to this API key's organization.`);
            console.error("Create/recreate KEEPERHUB_API_KEY from the same KeeperHub organization that owns 'Tender: Settle Claim', then replace the GitHub secret. Do not run Tender Live Proof yet.");
            process.exit(1);
          }

          const workflow = await read("Target workflow lookup", `${base}/api/workflows/${encodeURIComponent(workflowId)}`);
          if (!workflow.ok) {
            console.error("TARGET_LOOKUP_FAILED even though workflow appears in the list. Stop and inspect before any execution.");
            process.exit(1);
          }

          console.log("ORG_SCOPE_OK: API key authenticates and can see the target Tender workflow. Safe to proceed to a separate simulation-only preflight next.");
          NODE
