name: Tender Preflight Diagnostic

on:
  workflow_dispatch:
    inputs:
      recipient_wallet:
        description: Recipient wallet for read-only KeeperHub simulation
        required: true
      amount_usdc:
        description: USDC amount for read-only KeeperHub simulation
        required: true
        default: "0.01"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEEPERHUB_API_KEY: ${{ secrets.KEEPERHUB_API_KEY }}
      KEEPERHUB_BASE_URL: ${{ secrets.KEEPERHUB_BASE_URL }}
      KEEPERHUB_WORKFLOW_ID: ${{ secrets.KEEPERHUB_WORKFLOW_ID }}
      TENDER_RECIPIENT_WALLET: ${{ inputs.recipient_wallet }}
      TENDER_AMOUNT_USDC: ${{ inputs.amount_usdc }}
    steps:
      - name: Read-only KeeperHub diagnostics and transaction preflight — never broadcast
        shell: bash
        run: |
          node <<'NODE'
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is required`);
            return value;
          };

          const rawBase = required("KEEPERHUB_BASE_URL").replace(/\/+$/, "");
          const base = rawBase.replace(/\/api$/i, "");
          const workflowId = required("KEEPERHUB_WORKFLOW_ID");
          const apiKey = required("KEEPERHUB_API_KEY");
          const recipient = required("TENDER_RECIPIENT_WALLET");
          const amount = required("TENDER_AMOUNT_USDC");
          const auth = { Authorization: `Bearer ${apiKey}` };
          const jsonHeaders = { ...auth, "Content-Type": "application/json" };
          const usdcBaseSepolia = "0x036CbD53842c5426634e7929541eC2318f3dCF7e";

          const parse = async (res) => {
            const text = await res.text();
            let body = text;
            try { body = JSON.parse(text); } catch {}
            return { res, body };
          };

          const print = (label, res, body) => {
            console.log(`${label}: HTTP ${res.status} ${res.statusText}`);
            console.log(typeof body === "string" ? body.slice(0, 12000) : JSON.stringify(body, null, 2).slice(0, 12000));
          };

          console.log(`Base URL normalization: ${rawBase === base ? "unchanged" : "removed trailing /api"}`);
          console.log(`Target workflow ID present: ${Boolean(workflowId)}`);
          console.log(`Recipient: ${recipient}`);
          console.log(`Amount: ${amount}`);
          console.log("Mode: read-only diagnostics + dry-run simulation only. No broadcast endpoint is called without simulate=true.");

          const keysParsed = await parse(await fetch(`${base}/api/keys`, { headers: auth }));
          print("Auth probe /api/keys", keysParsed.res, keysParsed.body);
          if (!keysParsed.res.ok) throw new Error("AUTH_PROBE_FAILED");

          const workflowsParsed = await parse(await fetch(`${base}/api/workflows`, { headers: auth }));
          print("Workflow list /api/workflows", workflowsParsed.res, workflowsParsed.body);
          if (!workflowsParsed.res.ok) throw new Error("WORKFLOW_LIST_FAILED");

          const items = Array.isArray(workflowsParsed.body) ? workflowsParsed.body : (workflowsParsed.body?.items ?? []);
          const visible = items.map((w) => ({ id: w.id, name: w.name, projectId: w.projectId ?? null }));
          console.log("Visible workflows summary:");
          console.log(JSON.stringify(visible, null, 2));

          const match = visible.find((w) => w.id === workflowId);
          if (!match) throw new Error("ORG_SCOPE_MISMATCH");

          const workflowParsed = await parse(await fetch(`${base}/api/workflows/${encodeURIComponent(workflowId)}`, { headers: auth }));
          print("Target workflow lookup", workflowParsed.res, workflowParsed.body);
          if (!workflowParsed.res.ok) throw new Error("TARGET_LOOKUP_FAILED");

          console.log("ORG_SCOPE_OK");

          const workflowSimulation = await parse(await fetch(`${base}/api/workflows/${encodeURIComponent(workflowId)}/simulate`, {
            method: "POST",
            headers: jsonHeaders,
            body: JSON.stringify({ input: { recipient, amount } })
          }));
          print("Exact workflow simulation", workflowSimulation.res, workflowSimulation.body);

          if (!workflowSimulation.res.ok) {
            console.error("WORKFLOW_SIMULATION_FAILED: no broadcast occurred. Do not run Tender Live Proof yet.");
            process.exit(1);
          }

          const directSimulation = await parse(await fetch(`${base}/api/execute/transfer`, {
            method: "POST",
            headers: jsonHeaders,
            body: JSON.stringify({
              chainId: 84532,
              recipientAddress: recipient,
              amount,
              tokenAddress: usdcBaseSepolia,
              simulate: true
            })
          }));
          print("Equivalent ERC20 direct simulation", directSimulation.res, directSimulation.body);

          const directOk =
            directSimulation.res.ok &&
            directSimulation.body &&
            directSimulation.body.success === true &&
            directSimulation.body.wouldRevert === false;

          if (!directOk) {
            console.error("DIRECT_TRANSFER_PREFLIGHT_FAILED: simulation signed nothing and broadcast nothing. Do not run Tender Live Proof yet.");
            process.exit(1);
          }

          console.log("READ_ONLY_PREFLIGHT_OK: target workflow is visible, workflow preflight was accepted, and the equivalent Base Sepolia USDC transfer simulated successfully with wouldRevert=false. No funds moved.");
          NODE
